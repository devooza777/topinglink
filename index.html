<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🛍️ 추천 제품 모아보기</title>
<meta name="description" content="영상에서 본 제품을 바로 확인하세요!">
<meta property="og:title" content="🛍️ 추천 제품 모아보기">
<meta property="og:description" content="영상에서 본 제품을 바로 확인하세요!">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f4f5f7;min-height:100vh}
.header{background:linear-gradient(135deg,#667eea 0%,#4758ff 100%);color:#fff;text-align:center;padding:28px 16px 20px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
.header h1{font-size:22px;font-weight:800;margin-bottom:6px;letter-spacing:-0.4px}
.header p{font-size:13px;opacity:.9;font-weight:400}
.search-container{max-width:560px;margin:16px auto 0;padding:0 12px}
.search-input-wrap{position:relative;width:100%}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:15px;color:#888;pointer-events:none}
.search-input{width:100%;padding:12px 16px 12px 40px;border-radius:24px;border:none;font-size:14px;background:#fff;color:#222;box-shadow:0 3px 12px rgba(0,0,0,.1);outline:none;font-family:inherit;transition:box-shadow .2s}
.search-input:focus{box-shadow:0 4px 18px rgba(0,0,0,.18)}
.count-bar{max-width:560px;margin:12px auto 0;padding:0 16px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#777}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px 16px 24px;max-width:560px;margin:0 auto}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.05);text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s;position:relative}
.card:active{transform:scale(.97);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.img-wrap{width:100%;aspect-ratio:1;overflow:hidden;background:#f0f2f5;position:relative}
.img-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.badge-no{position:absolute;top:8px;left:8px;background:rgba(20,24,36,.85);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;backdrop-filter:blur(4px);z-index:2;letter-spacing:0.2px}
.card-body{padding:10px 12px 12px}
.card-title{font-size:13px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:#222;min-height:35px}
.price{font-size:14px;font-weight:800;color:#e53e3e;margin:4px 0 6px}
.card-btn{background:#667eea;color:#fff;text-align:center;padding:8px;border-radius:8px;font-size:12px;font-weight:700;margin-top:6px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.no-result{grid-column:1/-1;text-align:center;padding:50px 20px;color:#888;display:none}
.footer{text-align:center;padding:24px 16px;color:#aaa;font-size:11px;line-height:1.6}
@media(min-width:480px){.grid{gap:16px;padding:16px 20px 32px}}
</style>
</head>
<body>
<div class="header">
<h1>🛍️ 추천 제품 모아보기</h1>
<p>영상에서 본 제품을 바로 확인하세요!</p>
<div class="search-container">
    <div class="search-input-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-input" placeholder="상품명 또는 번호 검색 (예: 19, 디퓨저)..." oninput="filterProducts()" autocomplete="off">
    </div>
</div>
</div>
<div class="count-bar">
    <span id="productCount">총 1개 제품</span>
    <span style="font-size:11px;color:#999;">⚡ 실시간 검색</span>
</div>
<div class="grid" id="productGrid">

        <a href="https://toss.im/_m/F1jROggd" class="card" target="_blank" rel="noopener" data-name="센토 인텐스 프리미엄 대용량 디퓨저 550ml 3개 세트" data-no="1">
            <div class="img-wrap">
                <div class="badge-no">No. 1</div>
                <img src="https://shopping.toss.im/live/temp/2026-05-19/36a8ea1c-4d19-4d40-91bb-704ef890f399.png" alt="센토 인텐스 프리미엄 대용량 디퓨저 550ml 3개 세트" loading="lazy" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 200%22><rect fill=%22%23f0f0f0%22 width=%22200%22 height=%22200%22/><text x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%23aaa%22 font-size=%2220%22>No Image</text></svg>'">
            </div>
            <div class="card-body">
                <div class="card-title">센토 인텐스 프리미엄 대용량 디퓨저 550ml 3개 세트</div>
                <div class="price">19,900원</div>
                <div class="card-btn">구매하기 →</div>
            </div>
        </a>
<div id="noResult" class="no-result">
    <div style="font-size:40px;margin-bottom:10px;">🔍</div>
    <div>검색된 제품이 없습니다.</div>
</div>
</div>
<div class="footer">
마지막 업데이트: 2026.08.25 21:46<br>
</div>
<script>
function filterProducts() {
    var q = document.getElementById('searchInput').value.trim().toLowerCase();
    var cards = document.querySelectorAll('.card');
    var visible = 0;
    cards.forEach(function(card) {
        var name = (card.getAttribute('data-name') || '').toLowerCase();
        var no = (card.getAttribute('data-no') || '').toLowerCase();
        if (!q || name.indexOf(q) !== -1 || no === q || no.indexOf(q) !== -1) {
            card.style.display = '';
            visible++;
        } else {
            card.style.display = 'none';
        }
    });
    var countEl = document.getElementById('productCount');
    if (countEl) {
        countEl.textContent = q ? ('검색 결과 ' + visible + '개') : ('총 ' + cards.length + '개 제품');
    }
    var noResultEl = document.getElementById('noResult');
    if (noResultEl) {
        noResultEl.style.display = (visible === 0 && cards.length > 0) ? 'block' : 'none';
    }
}
</script>
</body>
</html>
