<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🛍️ 추천 제품 모아보기</title>
<meta name="description" content="영상에서 본 제품을 바로 확인하세요!">
<meta property="og:title" content="🛍️ 추천 제품 모아보기">
<meta property="og:description" content="영상에서 본 제품을 바로 확인하세요!">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f7f7f8;min-height:100vh}
.header{background:linear-gradient(135deg,#667eea 0%,#4758ff 100%);color:#fff;text-align:center;padding:28px 16px 24px}
.header h1{font-size:22px;font-weight:700;margin-bottom:6px;letter-spacing:-0.3px}
.header p{font-size:13px;opacity:.85;font-weight:400}
.count{display:inline-block;background:rgba(255,255,255,.2);border-radius:20px;padding:3px 12px;font-size:11px;margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:16px;max-width:560px;margin:0 auto}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.06);text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s}
.card:active{transform:scale(.97);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.img-wrap{width:100%;aspect-ratio:1;overflow:hidden;background:#f5f5f5}
.img-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.card-body{padding:10px 12px 12px}
.card-title{font-size:13px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:#222;min-height:36px}
.price{font-size:13px;font-weight:700;color:#e74c3c;margin:4px 0 6px}
.card-btn{background:#667eea;color:#fff;text-align:center;padding:8px;border-radius:8px;font-size:12px;font-weight:600;margin-top:6px}
.footer{text-align:center;padding:24px 16px;color:#bbb;font-size:11px;line-height:1.6}
@media(min-width:480px){.grid{gap:16px;padding:20px}}
</style>
</head>
<body>
<div class="header">
<h1>🛍️ 추천 제품 모아보기</h1>
<p>영상에서 본 제품을 바로 확인하세요!</p>
<div class="count">총 1개 제품</div>
</div>
<div class="grid">

        <a href="https://toss.im/_m/F1jROggd" class="card" target="_blank" rel="noopener">
            <div class="img-wrap">
                <img src="https://shopping.toss.im/live/temp/2026-05-19/36a8ea1c-4d19-4d40-91bb-704ef890f399.png" alt="센토 인텐스 프리미엄 대용량 디퓨저, 우드세이지, 550ml, 3개" loading="lazy" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 200%22><rect fill=%22%23f0f0f0%22 width=%22200%22 height=%22200%22/><text x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%23aaa%22 font-size=%2220%22>No Image</text></svg>'">
            </div>
            <div class="card-body">
                <div class="card-title">센토 인텐스 프리미엄 대용량 디퓨저, 우드세이지, 550ml, 3개</div>
                <div class="price">19,900원</div>
                <div class="card-btn">구매하기 →</div>
            </div>
        </a>
</div>
<div class="footer">
마지막 업데이트: 2026.08.25 21:21<br>
</div>
</body>
</html>
